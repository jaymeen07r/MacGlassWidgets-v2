[package]
name = "macglass-widgets"
version = "0.2.0"
description = "Frosted glass desktop widgets for Windows"
authors = ["You"]
edition = "2021"

[lib]
name = "macglass_widgets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
